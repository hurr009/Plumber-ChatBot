<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed test page</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 40px; line-height: 1.6; }
      h1 { color: #1e40af; }
    </style>
  </head>
  <body>
    <h1>Host website (test)</h1>
    <p>
      This page simulates a third-party site embedding the chatbot. The floating
      bubble in the bottom-right is injected by <code>widget.js</code>. It should
      not affect any styles on this page.
    </p>

    <!-- The one line a customer adds to their site.
         When served by Next.js at /test.html, this resolves to the same origin. -->
    <script src="/widget.js" defer></script>
  </body>
</html>
